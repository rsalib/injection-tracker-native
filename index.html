<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111827" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="A private clinical companion app for tracking peptide and hormone injection protocols, dose logging, vial inventory, and AI-powered drug interaction checking." />
    <title>Injection Tracker</title>
    <style>
      * { box-sizing: border-box; }
      html { height: 100%; }
      body { margin: 0; height: 100%; }
      #root { display: flex; flex-direction: column; height: 100dvh; height: -webkit-fill-available; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
